# Production stack, meant to sit behind SWAG on a home server.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# This is a standalone file, not an override of docker-compose.yml. Published
# ports cannot be removed by an override file — the lists merge — so a separate
# file is the only way to guarantee nothing is exposed to the host.
#
# Nothing here listens on the host. SWAG reaches the frontend and backend over
# the shared proxy network by container name; see docs/authentik-setup.md for
# the matching nginx configuration, and docs/deployment.md for the runbook.

name: gamereviews

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gamereviews-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamereview}
      POSTGRES_USER: ${POSTGRES_USER:-gamereview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # postgres starts as root to fix up data directory ownership and then drops
    # to the postgres user, so it needs these five capabilities. Dropping ALL
    # makes it fail with "failed switching to 'postgres'".
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gamereview} -d ${POSTGRES_DB:-gamereview}",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend (GraphQL API) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    image: gamereviews-backend
    container_name: gamereviews-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gamereview}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gamereview}
      RAWG_API_KEY: ${RAWG_API_KEY:?RAWG_API_KEY must be set}
      # Must match the X-Proxy-Secret literal in the SWAG proxy conf.
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET must be set}
      # SWAG proxies straight to this service, so exactly one hop.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Empty: everything is same-origin behind the proxy.
      CORS_ORIGINS: ""
    networks:
      - internal
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    image: gamereviews-frontend
    container_name: gamereviews-frontend
    restart: unless-stopped
    networks:
      - proxy
    read_only: true
    # nginx creates its temp directories under /tmp at startup and will not
    # start without a writable one.
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # SWAG's network, created outside this stack. Only the frontend and backend
  # join it; the database is deliberately not reachable from the proxy.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-swag}
  internal:
    driver: bridge

volumes:
  postgres_data:
