<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameReviews</title>
    <!-- Site-level link preview, for every path the SPA serves. Reviews get real
         per-review tags from the backend; see backend/src/routes/embed.ts. -->
    <meta
      name="description"
      content="Game reviews, scores and playtime from a small group of friends."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameReviews" />
    <meta property="og:title" content="GameReviews" />
    <meta
      property="og:description"
      content="Game reviews, scores and playtime from a small group of friends."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#8b5cf6" />
    <!-- No webfont link on purpose; see tailwind.config.js for the font stack. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
