server {
    # 8080, not 80: the container runs unprivileged and cannot bind a low port.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version to anyone scanning.
    server_tokens off;

    # The headers are included per location, not set once here, because a
    # location with any add_header of its own inherits none from the server. See
    # the comment at the top of security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # Lightweight endpoint for the container healthcheck.
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback — all routes serve index.html for React Router, /reviews/<slug>
    # included. A crawler asking for that path never reaches this container; the
    # reverse proxy sends it to the backend instead. See
    # deploy/swag/gamereviews.subdomain.conf.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for the HTML entry point
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
