# Security response headers for the SPA.
#
# Included from every location block rather than set once at server level, and
# not by accident: nginx's add_header does not merge with an inherited set. A
# location that defines any add_header of its own — and three here do, for
# Content-Type and Cache-Control — silently drops every header from its parent.
#
# It is worse than it looks. `location /` declares no add_header, so it appears
# to inherit safely, but its try_files falls through to /index.html, and that
# block does declare one — so every SPA route is served by a location that has
# dropped the inherited set. Configuring these once on `server` was measured
# serving zero of them on /, /index.html and /assets/ alike.
#
# helmet already sets equivalents on API responses, which is the place they
# matter least: those are read by fetch(), not rendered. The document that
# actually executes script is served from here.

# The bundle is the only script, the compiled stylesheet the only stylesheet, and
# both are same-origin — so script-src needs no 'unsafe-inline' and no 'unsafe-eval',
# which is the pair that makes a CSP worth having.
#
# style-src does allow 'unsafe-inline'. Nothing in the app sets a style attribute
# today, but React's style prop produces them, and an inline style cannot execute
# script under any CSP — so the strictness costs more than it buys here.
#
# img-src is the narrow one on purpose. Cover art is stored only from RAWG, and
# importGame now refuses anything but https; naming the host means an arbitrary
# URL that somehow reaches the database still cannot make a reader's browser
# fetch it.
#
# connect-src is same-origin because the SPA talks to /graphql and /graphql-auth
# on its own hostname, which is what lets the authentik cookie apply to them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.rawg.io; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

# frame-ancestors above supersedes this for current browsers; kept for older ones.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

# No Referer off-site. Nothing here depends on it, and the paths carry review and
# profile identifiers.
add_header Referrer-Policy "no-referrer" always;

# None of these are used, so none are available to anything that gets injected.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# Keeps a window this page opens from holding a handle back to it.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS is deliberately absent: TLS terminates at SWAG, which sets it for the
# whole hostname. Setting it here as well would put two sources of truth on one
# header, and this container is only ever reached over plaintext HTTP anyway.
