services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamereview
      POSTGRES_USER: gamereview
      POSTGRES_PASSWORD: gamereview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port not exposed to host — backend connects via internal Docker network.
    # To connect locally with psql/pgAdmin, uncomment the line below:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamereview -d gamereview"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (GraphQL API) ───────────────────────────────────────────────────
  backend:
    build:
      # The repository root, because the backend depends on the shared
      # workspace and a build context cannot reach outside itself.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      # The image defaults to production; this local stack overrides it so the
      # Apollo sandbox and localhost CORS keep working.
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://gamereview:gamereview@db:5432/gamereview
      RAWG_API_KEY: ${RAWG_API_KEY}
      # Optional locally. Set all four to exercise the real OIDC flow against
      # your authentik instance; leave them empty and AUTH_DEV_IDENTITY covers
      # sign-in instead. Note the SPA and API are on different ports here, so
      # the /auth routes are only reachable if you front both with one origin.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # There is no identity provider in front of the local stack, so fake a
      # signed-in user. Ignored whenever NODE_ENV=production.
      AUTH_DEV_IDENTITY: ${AUTH_DEV_IDENTITY:-dev-uid:devuser:dev@example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Ports are published straight to the host here, so no proxy hops.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "4000:4000"
    healthcheck:
      # node -e rather than curl/wget: guaranteed present in the runtime image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          action: rebuild
        - path: ./backend/prisma
          action: rebuild
        - path: ./backend/package.json
          action: rebuild
        - path: ./shared/src
          action: rebuild

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  frontend:
    build:
      # The repository root, for the same reason as the backend above.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Cross-origin here, which is why /auth and /export/reviews.md are not
        # reachable from this stack: both are same-origin backend paths that a
        # single reverse proxy is expected to front. See deploy/swag/.
        VITE_API_URL: http://localhost:4000/graphql
    restart: unless-stopped
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - path: ./frontend/src
          action: rebuild
        - path: ./frontend/index.html
          action: rebuild
        - path: ./frontend/package.json
          action: rebuild
        - path: ./shared/src
          action: rebuild

volumes:
  postgres_data:
