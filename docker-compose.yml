services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamereview
      POSTGRES_USER: gamereview
      POSTGRES_PASSWORD: gamereview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port not exposed to host — backend connects via internal Docker network.
    # To connect locally with psql/pgAdmin, uncomment the line below:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamereview -d gamereview"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (GraphQL API) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      # The image defaults to production; this local stack overrides it so the
      # Apollo sandbox and localhost CORS keep working.
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://gamereview:gamereview@db:5432/gamereview
      JWT_SECRET: ${JWT_SECRET}
      RAWG_API_KEY: ${RAWG_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Ports are published straight to the host here, so no proxy hops.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          action: rebuild
        - path: ./backend/prisma
          action: rebuild
        - path: ./backend/package.json
          action: rebuild

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/graphql
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    develop:
      watch:
        - path: ./frontend/src
          action: rebuild
        - path: ./frontend/index.html
          action: rebuild
        - path: ./frontend/package.json
          action: rebuild

volumes:
  postgres_data:
