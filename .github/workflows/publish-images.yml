name: Publish images

# Builds the two application images and pushes them to the GitHub Container
# registry. That is what lets a server run this stack without cloning the
# repository, installing a toolchain, or building anything — and it is the only
# way an image updater such as Watchtower can notice a new version at all, since
# those compare a running container's digest against a registry tag.
#
#   ghcr.io/<owner>/gamereviews-backend:latest    moves with the default branch
#   ghcr.io/<owner>/gamereviews-frontend:latest
#   ghcr.io/<owner>/gamereviews-{backend,frontend}:sha-<short>
#
# The sha- tags never move, so pinning one freezes a deployment even with an
# updater running against `latest`.
#
# New GHCR packages are private until someone changes that by hand. The images
# carry an org.opencontainers.image.source label, which links each package to
# this repository, so repository collaborators inherit read access and can pull
# with a read:packages token. See docs/deployment.md.
#
# workflow_dispatch is deliberate: it publishes from whatever ref it is run on,
# which is how you deploy a branch that has not been merged yet.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

# Two pushes of the same ref would race for the `latest` tag. Queue instead of
# cancelling: a half-finished push is worse than a redundant one.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/gamereviews-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id "${{ steps.image.outputs.name }}:latest" -u)
          echo "${{ matrix.component }} uid=$uid"
          test "$uid" -ne 0 || { echo "image runs as root"; exit 1; }

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

      - name: Summarise
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
