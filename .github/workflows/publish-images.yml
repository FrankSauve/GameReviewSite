name: Publish images

# Builds the two application images and pushes them to the GitHub Container
# registry. That is what lets a server run this stack without cloning the
# repository, installing a toolchain, or building anything — and it is the only
# way an image updater such as Watchtower can notice a new version at all, since
# those compare a running container's digest against a registry tag.
#
#   ghcr.io/<owner>/gamereviews-backend:latest    moves with the default branch
#   ghcr.io/<owner>/gamereviews-frontend:latest
#   ghcr.io/<owner>/gamereviews-{backend,frontend}:sha-<short>
#
# The sha- tags never move, so pinning one freezes a deployment even with an
# updater running against `latest`.
#
# New GHCR packages are private until someone changes that by hand. The images
# carry an org.opencontainers.image.source label, which links each package to
# this repository, so repository collaborators inherit read access and can pull
# with a read:packages token. See docs/deployment.md.
#
# workflow_dispatch is deliberate: it publishes from whatever ref it is run on,
# which is how you deploy a branch that has not been merged yet. Off the default
# branch it pushes only the sha- tag, so `latest` never points at unmerged code.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/publish-images.yml
  workflow_dispatch:

# Two pushes of the same ref would race for the `latest` tag. Queue instead of
# cancelling: a half-finished push is worse than a redundant one.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/gamereviews-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert the image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}" -u)
          echo "${{ matrix.component }} uid=$uid"
          test "$uid" -ne 0 || { echo "image runs as root"; exit 1; }

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha

      - name: Summarise
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
