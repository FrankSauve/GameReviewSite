# GameReviews — deployment snippet
#
# This is not a stack to run on its own. Copy the three services into the
# `services:` block of the compose file that already runs your reverse proxy,
# and the `networks:` and `volumes:` entries into that file's own sections.
# Everything then comes up, updates, and is backed up alongside the rest of your
# services, with one compose file and one `docker compose up -d`.
#
# It is nevertheless a valid compose file so that CI can parse it and assert the
# two properties the deployment depends on: that it publishes no ports, and that
# it builds nothing.
#
# ── Prerequisites ────────────────────────────────────────────────────────────
#
# The images are published by .github/workflows/publish-images.yml, under the
# repository owner's namespace, lowercased — change the two `image:` lines if you
# publish from a fork. A private package needs a one-off `docker login ghcr.io`
# on the server, and an image updater needs its own credentials — see
# docs/deployment.md.
#
# ── Environment ──────────────────────────────────────────────────────────────
#
# Three values in the compose project's .env. They are prefixed because that
# file is shared with your other services, and a bare POSTGRES_PASSWORD would
# collide with the database behind authentik:
#
#   GAMEREVIEWS_DB_PASSWORD=         # openssl rand -hex 24
#   GAMEREVIEWS_RAWG_API_KEY=        # https://rawg.io/apidocs
#   GAMEREVIEWS_AUTH_PROXY_SECRET=   # openssl rand -hex 32
#
# The last one must match the X-Proxy-Secret literal in the SWAG proxy conf at
# deploy/swag/gamereviews.subdomain.conf exactly.
#
# ── Reverse proxy ────────────────────────────────────────────────────────────
#
# Nothing here is published to the host. The proxy reaches the frontend and the
# backend by container name over the network it already shares with them, and
# identity arrives in HTTP headers — which is only sound while the API is
# unreachable by any other route. Keep that property and the design holds.

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Deliberately its own instance rather than a database inside one you already
  # run: an isolated volume is a clean unit to snapshot and restore, and a major
  # upgrade here then has nothing to do with your other services.
  gamereviews-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: gamereviews-db
    restart: unless-stopped
    # The only service that is not on the default network, so the proxy — and
    # everything else sharing that network — cannot reach the database at all.
    networks:
      - gamereviews-internal
    environment:
      POSTGRES_DB: gamereview
      POSTGRES_USER: gamereview
      POSTGRES_PASSWORD: ${GAMEREVIEWS_DB_PASSWORD:?GAMEREVIEWS_DB_PASSWORD must be set}
    volumes:
      - gamereviews_db:/var/lib/postgresql/data
    # postgres starts as root to fix up data directory ownership and then drops
    # to the postgres user, so it needs these five capabilities. Dropping ALL
    # makes it fail with "failed switching to 'postgres'".
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamereview -d gamereview"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend (GraphQL API) ───────────────────────────────────────────────────
  # Applies any pending Prisma migrations on startup and exits rather than serve
  # against a half-migrated schema, so an image update needs no follow-up step.
  gamereviews-backend:
    image: ghcr.io/franksauve/gamereviews-backend:latest
    container_name: gamereviews-backend
    restart: unless-stopped
    networks:
      - default
      - gamereviews-internal
    environment:
      DATABASE_URL: postgresql://gamereview:${GAMEREVIEWS_DB_PASSWORD}@gamereviews-db:5432/gamereview
      RAWG_API_KEY: ${GAMEREVIEWS_RAWG_API_KEY:?GAMEREVIEWS_RAWG_API_KEY must be set}
      # Must match the X-Proxy-Secret literal in the SWAG proxy conf.
      AUTH_PROXY_SECRET: ${GAMEREVIEWS_AUTH_PROXY_SECRET:?GAMEREVIEWS_AUTH_PROXY_SECRET must be set}
      # The proxy talks straight to this container, so exactly one hop. Wrong
      # values make rate limiting key on the proxy's IP, and one abusive client
      # then locks out everyone.
      TRUST_PROXY_HOPS: 1
      # Empty: everything is same-origin behind the proxy.
      CORS_ORIGINS: ""
    # PORT=4000 and NODE_ENV=production are baked into the image.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      gamereviews-db:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  # The bundle calls the relative paths /graphql and /graphql-auth, so the image
  # carries no hostname and needs no per-deployment build.
  gamereviews-frontend:
    image: ghcr.io/franksauve/gamereviews-frontend:latest
    container_name: gamereviews-frontend
    restart: unless-stopped
    read_only: true
    # nginx creates its temp directories under /tmp at startup and will not
    # start without a writable one.
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  gamereviews-internal:

volumes:
  gamereviews_db:
