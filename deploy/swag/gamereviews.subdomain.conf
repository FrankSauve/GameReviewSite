## Version 2025/07/18
# make sure that your containers are named gamereviews-frontend and gamereviews-backend
# make sure that your dns has a cname set for gamereviews
#
# Copy to /config/nginx/proxy-confs/gamereviews.subdomain.conf, substituting the
# X-Proxy-Secret placeholder further down with the AUTH_PROXY_SECRET value from
# the stack's .env. Step 6 of docs/authentik-setup.md has the sed command. Do
# not commit the filled-in copy. The placeholder deliberately appears exactly
# once, so substituting it cannot leave the secret behind in a comment.
#
# Reviews are public; only /graphql-auth is authenticated. authentik is wired up
# by hand below rather than by including authentik-location.conf — see the
# comment on that location for why.

server {
    listen 443 ssl;
    # listen 443 quic;
    listen [::]:443 ssl;
    # listen [::]:443 quic;

    server_name gamereviews.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Geoblocking Check — requires SWAG's geoip2 setup, which is what defines
    # $lan-ip and $geo-whitelist. Delete both lines if geoip2 is not configured,
    # or the config will not load. Note this restricts a site that is otherwise
    # readable by anyone to your whitelisted countries plus the LAN.
    if ($lan-ip = yes) { set $geo-whitelist yes; }
    if ($geo-whitelist = no) { return 403; }

    # authentik outpost endpoints, including the sign-in and sign-out flows.
    # Must stay unauthenticated.
    include /config/nginx/authentik-server.conf;

    # authentik's response headers can exceed the default buffer sizes.
    proxy_buffers     8 16k;
    proxy_buffer_size 32k;

    # ── The SPA: public ──────────────────────────────────────────────────────
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app gamereviews-frontend;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── Public GraphQL: reads only, never authenticated ──────────────────────
    location = /graphql {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # The server block disables the body limit for the SPA's benefit; a
        # GraphQL document does not need it. The backend caps the parsed body at
        # 100kb, so bounding it here just declines earlier.
        client_max_body_size 128k;

        # The SPA only ever POSTs. Apollo will also answer a query sent as a GET
        # with the document in the query string, which is a second way in that
        # nothing here needs — and one that skipped the RAWG-specific rate limit,
        # because that limiter reads the request body and a GET has none.
        # The limiter now inspects both, but there is no reason to accept the
        # method at all.
        limit_except POST OPTIONS {
            deny all;
        }

        # Strip anything a client tries to smuggle in. The backend ignores these
        # on this path regardless, but do not rely on a single control. This is
        # every header authentik-location.conf would set, not just the three the
        # backend reads.
        proxy_set_header X-authentik-uid      "";
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-email    "";
        proxy_set_header X-authentik-name     "";
        proxy_set_header X-authentik-groups   "";
        proxy_set_header X-Proxy-Secret       "";

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port/graphql;
    }

    # ── Authenticated GraphQL: the me query and all mutations ────────────────
    #
    # Deliberately not `include /config/nginx/authentik-location.conf;`. That
    # file is otherwise exactly this, but its `error_page 401` redirects to
    # @goauthentik_proxy_signin — right for a whole-page request, wrong here.
    # This endpoint is only ever called by fetch(), which would follow the 302
    # and try to parse an HTML login page as a GraphQL response. A plain 401 is
    # what tells the app "you are signed out", which is a normal state on a site
    # whose reviews are public.
    location = /graphql-auth {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        client_max_body_size 128k;

        limit_except POST OPTIONS {
            deny all;
        }

        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @graphql_unauthenticated;

        auth_request_set $authentik_uid      $upstream_http_x_authentik_uid;
        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_email    $upstream_http_x_authentik_email;
        auth_request_set $set_cookie         $upstream_http_set_cookie;
        add_header Set-Cookie $set_cookie;

        # These overwrite any client-supplied values of the same name.
        proxy_set_header X-authentik-uid      $authentik_uid;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-email    $authentik_email;
        proxy_set_header X-Proxy-Secret       "REPLACE_WITH_AUTH_PROXY_SECRET";

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port/graphql-auth;
    }

    location @graphql_unauthenticated {
        internal;
        default_type application/json;
        return 401 '{"errors":[{"message":"Not signed in","extensions":{"code":"UNAUTHENTICATED"}}]}';
    }
}
