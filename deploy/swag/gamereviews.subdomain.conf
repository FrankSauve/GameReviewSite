## Version 2025/07/18
# make sure that your containers are named gamereviews-frontend and gamereviews-backend
# make sure that your dns has a cname set for reviews

# ── Who gets the link preview ────────────────────────────────────────────────
#
# The frontend is a static SPA: what nginx serves is an empty <div id="root">,
# and every word on the page arrives from JavaScript afterwards. Crawlers do not
# run JavaScript, so a review pasted into Discord unfurls into nothing unless
# the meta tags are served as markup — which only the backend can do.
#
# This is the switch for that: known bots get the backend's stub, everyone else
# gets the app. Matching on user agent is a weak signal, and deliberately so —
# the failure in both directions is harmless. A bot that is not on this list
# gets no preview, exactly as today; a person misdetected as one gets a small
# page with the review's title, score and a link to it.
#
# A map, not an `if`, because a map is evaluated lazily once per request and can
# be read without knowing nginx's rewrite phases. It sits outside the server
# block because that is where `map` is allowed: SWAG includes these proxy-confs
# from the http context, so a directive at the top of the file is in it.
map $http_user_agent $review_upstream_app {
    default                     gamereviews-frontend;
    "~*discordbot"              gamereviews-backend;
    "~*twitterbot"              gamereviews-backend;
    "~*facebookexternalhit"     gamereviews-backend;
    "~*slackbot"                gamereviews-backend;
    "~*telegrambot"             gamereviews-backend;
    "~*whatsapp"                gamereviews-backend;
    "~*mastodon"                gamereviews-backend;
    "~*bluesky"                 gamereviews-backend;
    "~*linkedinbot"             gamereviews-backend;
    "~*redditbot"               gamereviews-backend;
    "~*embedly"                 gamereviews-backend;
    "~*iframely"                gamereviews-backend;
    "~*skypeuripreview"         gamereviews-backend;
    "~*googlebot"               gamereviews-backend;
    "~*bingbot"                 gamereviews-backend;
    "~*applebot"                gamereviews-backend;
}

# The port has to follow the app, and nginx has no way to carry two values out
# of one map.
map $review_upstream_app $review_upstream_port {
    default                 8080;
    gamereviews-backend     4000;
}

# Whether this request is allowed past the geoblock on its own.
#
# The geoblock is what stops link previews working at all otherwise: Discord and
# the rest fetch from cloud IPs that are not in anybody's country whitelist, so
# the crawler gets a 403 and the paste unfurls into nothing. This exempts exactly
# the requests that are routed to the embed stub -- anonymous, read-only, and
# carrying nothing the site does not already serve to any signed-out visitor.
#
# It does mean anyone can read a review's title, score and first lines by sending
# a Discordbot user agent. That is the feature: the point of an embed is that a
# stranger's chat client can render it. The geoblock still covers the app itself.
map $review_upstream_app $geoblock_exempt {
    default                 no;
    gamereviews-backend     yes;
}

server {
    listen 443 ssl;
    # listen 443 quic;
    listen [::]:443 ssl;
    # listen [::]:443 quic;

    server_name reviews.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # The geoblock used to live here, once per server. It is now repeated in each
    # location instead, because /reviews/ has to be able to opt a crawler out of
    # it and a `return 403` in the server block runs before any location is
    # chosen. Every location below still has it; only the embed stub does not.

    # ── The SPA ──────────────────────────────────────────────────────────────
    location / {
        # Geoblocking Check
        if ($lan-ip = yes) { set $geo-whitelist yes; }
        if ($geo-whitelist = no) { return 403; }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app gamereviews-frontend;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── The OIDC flow ────────────────────────────────────────────────────────
    #
    # /auth/login redirects to authentik, /auth/callback receives the
    # authorization code, /auth/logout ends the session. These must not be
    # behind any proxy-level authentication -- they are the authentication.
    #
    # Whole-prefix rather than exact matches, because the callback arrives with
    # a query string and more routes may be added here later.
    location /auth/ {
        # Geoblocking Check
        if ($lan-ip = yes) { set $geo-whitelist yes; }
        if ($geo-whitelist = no) { return 403; }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        client_max_body_size 16k;

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── The markdown export ──────────────────────────────────────────────────
    #
    # GET /export/reviews.md streams one file containing every review of the
    # signed-in account. It is not a GraphQL field because the schema's list
    # bounds exist to stop exactly this response size; see
    # backend/src/routes/export.ts.
    #
    # Buffering is off so a long export starts arriving immediately rather than
    # after nginx has collected all of it, and the read timeout is raised
    # because the backend reads it in batches.
    location /export/ {
        # Geoblocking Check
        if ($lan-ip = yes) { set $geo-whitelist yes; }
        if ($geo-whitelist = no) { return 403; }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # A GET with no body.
        client_max_body_size 1k;

        limit_except GET {
            deny all;
        }

        proxy_buffering off;
        proxy_read_timeout 120s;

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── Review pages, and their link previews ────────────────────────────────
    #
    # Same URL, two upstreams, chosen by the map at the top of this file: a
    # crawler is proxied to the backend for an HTML stub carrying Open Graph
    # tags, and every browser goes to the SPA as before. The backend serves this
    # path itself (backend/src/routes/embed.ts), so nothing is rewritten here.
    #
    # A prefix match, so /reviews/<slug> is covered while /reviews alone -- which
    # the SPA has no route for -- falls to the catch-all. Its position in the
    # file does not matter: nginx picks the longest matching prefix, and this one
    # is longer than `/`.
    location /reviews/ {
        # Geoblocking Check, with the crawler exemption described at the top.
        if ($lan-ip = yes) { set $geo-whitelist yes; }
        if ($geoblock_exempt = yes) { set $geo-whitelist yes; }
        if ($geo-whitelist = no) { return 403; }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        limit_except GET HEAD {
            deny all;
        }

        set $upstream_app $review_upstream_app;
        set $upstream_port $review_upstream_port;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── The API ──────────────────────────────────────────────────────────────
    #
    # One endpoint. Authorization happens per field inside the app, which is why
    # this no longer needs a guarded twin: nginx could not read a GraphQL body to
    # tell a mutation from a query, and now it does not need to.
    location = /graphql {
        # Geoblocking Check
        if ($lan-ip = yes) { set $geo-whitelist yes; }
        if ($geo-whitelist = no) { return 403; }

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # The server block disables the body limit for the SPA's benefit; a
        # GraphQL document does not need it. The backend caps the parsed body at
        # 100kb, so bounding it here just declines earlier.
        client_max_body_size 128k;

        # The SPA only ever POSTs. Apollo will also answer a query sent as a GET
        # with the document in the query string, which is a second way in that
        # nothing here needs — and one that skipped the RAWG-specific rate limit,
        # because that limiter reads the request body and a GET has none.
        # The limiter now inspects both, but there is no reason to accept the
        # method at all.
        limit_except POST OPTIONS {
            deny all;
        }

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port/graphql;
    }
}
