## Version 2025/07/18
# make sure that your containers are named gamereviews-frontend and gamereviews-backend
# make sure that your dns has a cname set for gamereviews
#
# There is no secret to substitute in this file, and nothing here participates in
# authentication. The backend is the OAuth2 client: it runs the OIDC flow against
# authentik itself and issues its own session cookie, so this is a plain reverse
# proxy. No auth_request, no authentik outpost, no identity headers.
#
# That is the point of the change -- see docs/authentik-setup.md. It also means a
# mistake in this file can no longer authenticate anyone.

server {
    listen 443 ssl;
    # listen 443 quic;
    listen [::]:443 ssl;
    # listen [::]:443 quic;

    server_name gamereviews.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    # Geoblocking Check — requires SWAG's geoip2 setup, which is what defines
    # $lan-ip and $geo-whitelist. Delete both lines if geoip2 is not configured,
    # or the config will not load. Note this restricts a site that is otherwise
    # readable by anyone to your whitelisted countries plus the LAN.
    if ($lan-ip = yes) { set $geo-whitelist yes; }
    if ($geo-whitelist = no) { return 403; }

    # ── The SPA ──────────────────────────────────────────────────────────────
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app gamereviews-frontend;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── The OIDC flow ────────────────────────────────────────────────────────
    #
    # /auth/login redirects to authentik, /auth/callback receives the
    # authorization code, /auth/logout ends the session. These must not be
    # behind any proxy-level authentication -- they are the authentication.
    #
    # Whole-prefix rather than exact matches, because the callback arrives with
    # a query string and more routes may be added here later.
    location /auth/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # A redirect and a form-encoded callback. Nothing large.
        client_max_body_size 16k;

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # ── The API ──────────────────────────────────────────────────────────────
    #
    # One endpoint. Authorization happens per field inside the app, which is why
    # this no longer needs a guarded twin: nginx could not read a GraphQL body to
    # tell a mutation from a query, and now it does not need to.
    location = /graphql {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # The server block disables the body limit for the SPA's benefit; a
        # GraphQL document does not need it. The backend caps the parsed body at
        # 100kb, so bounding it here just declines earlier.
        client_max_body_size 128k;

        # The SPA only ever POSTs. Apollo will also answer a query sent as a GET
        # with the document in the query string, which is a second way in that
        # nothing here needs — and one that skipped the RAWG-specific rate limit,
        # because that limiter reads the request body and a GET has none.
        # The limiter now inspects both, but there is no reason to accept the
        # method at all.
        limit_except POST OPTIONS {
            deny all;
        }

        set $upstream_app gamereviews-backend;
        set $upstream_port 4000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port/graphql;
    }
}
